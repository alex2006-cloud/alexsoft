name: Landing

on:
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - run: npm ci

      # Lint locally currently crashes (eslint-config-next + ESLint 9).
      # next build already type-checks TypeScript.
      - run: npm run build
