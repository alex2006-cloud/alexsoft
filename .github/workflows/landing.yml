name: Landing

on:
  push:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

env:
  LANDING_URL: https://osipcraft.ru
  DEPLOY_HOST: 130.17.1.193
  DEPLOY_USER: root
  DEPLOY_PATH: /var/www/osipcraft

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json

      - run: npm ci

      # Lint locally currently crashes (eslint-config-next + ESLint 9).
      # next build already type-checks TypeScript.
      - run: npm run build
        env:
          LANDING_URL: ${{ env.LANDING_URL }}

      - uses: actions/upload-artifact@v4
        with:
          name: landing-static
          path: apps/landing/out/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: landing-static
          path: out

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LANDING_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload static site to VPS
        run: |
          set -euo pipefail
          rsync -avz --delete \
            out/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chown -R www-data:www-data ${DEPLOY_PATH}"
