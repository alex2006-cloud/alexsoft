name: Site

on:
  push:
    paths:
      - "apps/landing/**"
      - "apps/games/**"
      - ".github/workflows/landing.yml"
  pull_request:
    paths:
      - "apps/landing/**"
      - "apps/games/**"
      - ".github/workflows/landing.yml"
  workflow_dispatch:

env:
  LANDING_URL: https://osipcraft.ru
  DEPLOY_HOST: 130.17.1.193
  DEPLOY_USER: root
  DEPLOY_PATH: /var/www/osipcraft

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/landing/package-lock.json
            apps/games/package-lock.json

      - name: Build landing
        working-directory: apps/landing
        run: |
          npm ci
          npm run build
        env:
          LANDING_URL: ${{ env.LANDING_URL }}

      - name: Build games
        working-directory: apps/games
        run: |
          npm ci
          npm run build
        env:
          LANDING_URL: ${{ env.LANDING_URL }}

      - name: Merge games into landing static export
        run: |
          set -euo pipefail
          mkdir -p apps/landing/out/games
          # Games use basePath=/games; export lives at out/ with asset URLs /games/_next/...
          # Place that tree under landing/out/games/ so Nginx serves /games correctly.
          cp -a apps/games/out/. apps/landing/out/games/
          test -f apps/landing/out/index.html
          test -f apps/landing/out/games/index.html
          test -d apps/landing/out/games/_next
          ls -la apps/landing/out/games | head -n 30

      - uses: actions/upload-artifact@v4
        with:
          name: site-static
          path: apps/landing/out/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-static
          path: out

      - name: Load SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LANDING_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Upload static site to VPS
        run: |
          set -euo pipefail
          rsync -avz --delete \
            out/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}/"
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "chown -R www-data:www-data ${DEPLOY_PATH}"
