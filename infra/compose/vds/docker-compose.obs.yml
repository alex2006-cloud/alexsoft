# Observability on VDS (фаза 6) — ADR-0022.
# UI только localhost + SSH-туннель (не публиковать в Nginx day-1).
#
#   cd /opt/alexsoft/infra/compose/vds
#   set -a && . /etc/alexsoft/.env && set +a
#   mkdir -p /var/lib/alexsoft/{loki,prometheus,grafana,alloy}
#   docker compose -f docker-compose.yml -f docker-compose.obs.yml up -d
#   bash smoke-obs.sh
#
# Туннель: ssh -L 3001:127.0.0.1:3001 -L 9090:127.0.0.1:9090 root@VDS

name: alexsoft-vds

services:
  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./obs/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - /var/lib/alexsoft/loki:/loki
    networks: [alexsoft]
    ports:
      - "127.0.0.1:3100:3100"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./obs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/lib/alexsoft/prometheus:/prometheus
    networks: [alexsoft]
    ports:
      - "127.0.0.1:9090:9090"
    mem_limit: 384m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
    volumes:
      - ./obs/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/alexsoft/alloy:/var/lib/alloy
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    environment:
      HOSTNAME: alexsoft-vds
      PROCFS_ROOT: /host/proc
      SYSFS_ROOT: /host/sys
      ROOTFS_ROOT: /host/root
    networks: [alexsoft]
    ports:
      - "127.0.0.1:12345:12345"
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_HTTP_PORT: "3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - /var/lib/alexsoft/grafana:/var/lib/grafana
      - ./obs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [alexsoft]
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    mem_limit: 256m
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  alexsoft:
    external: true
    name: alexsoft
