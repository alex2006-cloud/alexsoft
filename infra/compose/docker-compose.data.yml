# Опционально: Postgres в Docker (альтернатива ADR-0003, superseded для Windows).
# Основной путь локально: нативная установка — ADR-0004, infra/postgres/README.md
# Запуск: docker compose -f infra/compose/docker-compose.data.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alexsoft}
      POSTGRES_USER: ${POSTGRES_USER:-alexsoft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
