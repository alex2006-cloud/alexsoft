# Single-node Loki for local Windows lab (alexsoft stage 3).
# Paths and ports expand from env when started with --config.expand-env=true
# (see start-loki.ps1). Official base: grafana/loki cmd/loki/loki-local-config.yaml

auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: ${LOKI_PORT}
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: ${LOKI_GRPC_PORT}
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: ${LOKI_DATA}
  storage:
    filesystem:
      chunks_directory: ${LOKI_DATA}/chunks
      rules_directory: ${LOKI_DATA}/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

limits_config:
  allow_structured_metadata: true
  volume_enabled: true

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://127.0.0.1:9093

frontend:
  encoding: protobuf

analytics:
  reporting_enabled: false
