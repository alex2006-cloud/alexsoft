# Local single-node Prometheus for alexsoft stage 3 (Windows native).
# Self-scrape below. Alloy also remote_writes its scrape results here
# (requires --web.enable-remote-write-receiver on start-prometheus.ps1).

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["127.0.0.1:9090"]
