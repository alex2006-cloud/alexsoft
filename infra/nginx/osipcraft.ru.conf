# Host Nginx на VPS — старый домен osipcraft.ru только редиректит на alexsoft.space.
# Сертификаты Let’s Encrypt: /etc/letsencrypt/live/osipcraft.ru/
# Установка:
#   scp infra/nginx/osipcraft.ru.conf root@VPS:/etc/nginx/sites-available/osipcraft.ru
#   ssh root@VPS 'nginx -t && systemctl reload nginx'

server {
	listen 80;
	listen [::]:80;
	server_name osipcraft.ru www.osipcraft.ru;
	return 301 https://alexsoft.space$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name osipcraft.ru www.osipcraft.ru;

	ssl_certificate /etc/letsencrypt/live/osipcraft.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/osipcraft.ru/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	return 301 https://alexsoft.space$request_uri;
}
