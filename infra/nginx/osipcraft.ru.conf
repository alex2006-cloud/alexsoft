# Host Nginx на VPS (osipcraft.ru). Certbot уже выпустил сертификаты в /etc/letsencrypt.
# Установка: скопировать в /etc/nginx/sites-available/osipcraft.ru, symlink в sites-enabled, nginx -t && reload.

# HTTP → HTTPS (канон — apex)
server {
	listen 80;
	listen [::]:80;
	server_name osipcraft.ru www.osipcraft.ru;
	return 301 https://osipcraft.ru$request_uri;
}

# www → apex
server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name www.osipcraft.ru;

	ssl_certificate /etc/letsencrypt/live/osipcraft.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/osipcraft.ru/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	return 301 https://osipcraft.ru$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name osipcraft.ru;

	ssl_certificate /etc/letsencrypt/live/osipcraft.ru/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/osipcraft.ru/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /var/www/osipcraft;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

	location = /icon {
		default_type image/png;
	}

	location = /opengraph-image {
		default_type image/png;
	}

	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	error_page 404 /404.html;
}
