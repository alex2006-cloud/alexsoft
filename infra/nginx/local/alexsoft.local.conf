# Local API gateway / edge (ADR-0019, ADR-0020). TEMPLATE: start-nginx.ps1 substitutes the
# double-at placeholders from .env and writes the result to %LOCALAPPDATA%\AlexsoftNginx\...\conf\alexsoft.conf.
# Nginx does NOT validate JWT: FastAPI does (ADR-0019). Gateway = routing, limits, headers, request id, logs.

worker_processes  1;
error_log  logs/error.log  warn;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    server_names_hash_bucket_size  64;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size  1m;

    # Correlation id: reuse the incoming one, otherwise nginx's own
    map $http_x_request_id $req_id {
        default  $http_x_request_id;
        ""       $request_id;
    }
    map $http_upgrade $connection_upgrade {
        default  upgrade;
        ""       close;
    }

    log_format json_access escape=json
        '{"time":"$time_iso8601","req_id":"$req_id","remote":"$remote_addr","host":"$host",'
        '"method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
        '"rt":$request_time,"upstream":"$upstream_addr","ua":"$http_user_agent"}';
    access_log  logs/access.log  json_access;

    # Rate limits (per client IP)
    limit_req_zone  $binary_remote_addr  zone=site:10m  rate=30r/s;
    limit_req_zone  $binary_remote_addr  zone=app:10m   rate=20r/s;
    limit_req_zone  $binary_remote_addr  zone=auth:10m  rate=10r/s;
    limit_req_status  429;

    # Common headers (CSP is left to the apps: Next dev needs inline scripts)
    map $scheme $hsts_header {
        default  "";
        https    "max-age=31536000; includeSubDomains";
    }

    # ---------------------------------------------------------------- unknown hosts -> site
    server {
        listen       @@GATEWAY_PORT@@ default_server;
        server_name  _;
        return 302 @@PUBLIC_SITE_URL@@$request_uri;
    }

    # ---------------------------------------------------------------- site: landing, games, cabinet
    server {
        listen       @@GATEWAY_PORT@@;
        server_name  @@SITE_HOST@@;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Request-Id $req_id always;

        proxy_http_version 1.1;
        proxy_set_header Host               $http_host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-Host   $http_host;
        proxy_set_header X-Request-Id       $req_id;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        # Cabinet (Next.js SSR + BFF under /app, incl. /app/api/*). SSE: no buffering, long read timeout.
        location = /app {
            limit_req zone=app burst=40 nodelay;
            proxy_pass http://127.0.0.1:@@CABINET_PORT@@;
        }
        location /app/ {
            limit_req zone=app burst=40 nodelay;
            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:@@CABINET_PORT@@;
        }

        # /api/* is reserved for a future public API; BL is never exposed here (127.0.0.1 only)
        location /api/ {
            return 404;
        }

        # Landing + games (dev proxies or built static files, see start-nginx.ps1 -Static)
        include landing.conf;
    }

    # ---------------------------------------------------------------- IdP (Authentik)
    server {
        listen       @@GATEWAY_PORT@@;
        server_name  @@AUTH_HOST@@;

        client_max_body_size 5m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security $hsts_header always;
        add_header X-Request-Id $req_id always;

        location / {
            limit_req zone=auth burst=30 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Host               $http_host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_set_header X-Forwarded-Host   $http_host;
            proxy_set_header X-Request-Id       $req_id;
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_read_timeout 120s;
            proxy_pass http://127.0.0.1:@@AUTHENTIK_PORT@@;
        }
    }
}
