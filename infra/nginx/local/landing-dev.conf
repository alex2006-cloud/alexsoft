        # dev: landing and games run as Next dev servers (HMR needs WebSocket upgrade, set in the server block)
        location /games/ {
            limit_req zone=site burst=60 nodelay;
            proxy_pass http://127.0.0.1:3010;
        }
        location / {
            limit_req zone=site burst=60 nodelay;
            proxy_pass http://127.0.0.1:3000;
        }
