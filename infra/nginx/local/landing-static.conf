        # static: built files (apps/landing/out, apps/games/out) served by nginx, no Node (as on the VPS)
        location /games/ {
            limit_req zone=site burst=60 nodelay;
            alias @@GAMES_OUT@@/;
            try_files $uri $uri.html $uri/index.html =404;
        }
        location / {
            limit_req zone=site burst=60 nodelay;
            root @@LANDING_OUT@@;
            try_files $uri $uri.html $uri/index.html =404;
        }
