# Временная HTTP-заглушка до DNS cutover + certbot.
# После A-записей на VPS IP:
#   certbot --nginx -d alexsoft.space -d www.alexsoft.space
# затем заменить на alexsoft.space.conf (полный HTTPS).

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	# не ловить auth.* — для него отдельный server_name
	server_name alexsoft.space www.alexsoft.space;

	root /var/www/alexsoft;
	index index.html;

	# Cabinet SSR (фаза 4). На живом VPS Certbot мог вписать listen/ssl в этот файл —
	# достаточно заменить этот location; полный conf: alexsoft.space.conf.
	location = /app {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:3020;
	}
	location /app/ {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_read_timeout 300s;
		proxy_pass http://127.0.0.1:3020;
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
