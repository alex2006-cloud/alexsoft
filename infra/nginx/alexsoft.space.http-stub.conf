# Временная HTTP-заглушка до DNS cutover + certbot.
# После A-записей на VPS IP:
#   certbot --nginx -d alexsoft.space -d www.alexsoft.space
# затем заменить на alexsoft.space.conf (полный HTTPS).

server {
	listen 80 default_server;
	listen [::]:80 default_server;
	# не ловить auth.* — для него отдельный server_name
	server_name alexsoft.space www.alexsoft.space;

	root /var/www/alexsoft;
	index index.html;

	# кабинет (фаза 4) — пока заглушка
	location /app {
		default_type text/plain;
		return 503 'cabinet not deployed yet (phase 4)\n';
	}

	location / {
		try_files $uri $uri/ =404;
	}
}
