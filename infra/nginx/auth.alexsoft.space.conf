# Host Nginx на VPS — IdP (Authentik) на auth.alexsoft.space. ГОТОВ, НЕ ПРИМЕНЁН (ADR-0020):
# сейчас Authentik работает только локально. Применять вместе с выкаткой Authentik и кабинета на VPS.
# Certbot: certbot --nginx -d auth.alexsoft.space  (сертификат отдельный от alexsoft.space)
# Для кабинета в server alexsoft.space добавить location = /app и /app/ (proxy_pass на 127.0.0.1:3020,
# proxy_buffering off для SSE) — как в infra/nginx/local/alexsoft.local.conf.

server {
	listen 80;
	listen [::]:80;
	server_name auth.alexsoft.space;
	return 301 https://auth.alexsoft.space$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name auth.alexsoft.space;

	ssl_certificate /etc/letsencrypt/live/auth.alexsoft.space/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/auth.alexsoft.space/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	client_max_body_size 5m;
	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

	location / {
		proxy_http_version 1.1;
		proxy_set_header Host $http_host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_read_timeout 120s;
		proxy_pass http://127.0.0.1:9100;
	}
}

# в http {} (например /etc/nginx/conf.d/websocket-map.conf):
# map $http_upgrade $connection_upgrade { default upgrade; "" close; }
