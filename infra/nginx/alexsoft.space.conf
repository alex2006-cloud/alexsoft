# Host Nginx на VPS — канонический домен alexsoft.space.
# Статика: /var/www/osipcraft (имя каталога историческое, менять не обязательно).
# Certbot: /etc/letsencrypt/live/alexsoft.space/
# Установка:
#   scp infra/nginx/alexsoft.space.conf root@VPS:/etc/nginx/sites-available/alexsoft.space
#   ssh root@VPS 'ln -sf /etc/nginx/sites-available/alexsoft.space /etc/nginx/sites-enabled/alexsoft.space && nginx -t && systemctl reload nginx'

server {
	listen 80;
	listen [::]:80;
	server_name alexsoft.space www.alexsoft.space;
	return 301 https://alexsoft.space$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name www.alexsoft.space;

	ssl_certificate /etc/letsencrypt/live/alexsoft.space/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/alexsoft.space/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	return 301 https://alexsoft.space$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name alexsoft.space;

	ssl_certificate /etc/letsencrypt/live/alexsoft.space/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/alexsoft.space/privkey.pem;
	include /etc/letsencrypt/options-ssl-nginx.conf;
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

	root /var/www/osipcraft;
	index index.html;

	gzip on;
	gzip_types text/plain text/css application/javascript application/json image/svg+xml;

	add_header X-Content-Type-Options nosniff always;
	add_header Referrer-Policy "strict-origin-when-cross-origin" always;
	add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

	location = /icon {
		default_type image/png;
	}

	location = /opengraph-image {
		default_type image/png;
	}

	# Cabinet SSR + BFF (фаза 4). BL API остаётся на 127.0.0.1:8100, не публикуем.
	location = /app {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_pass http://127.0.0.1:3020;
	}
	location /app/ {
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		proxy_read_timeout 300s;
		proxy_pass http://127.0.0.1:3020;
	}

	location / {
		try_files $uri $uri.html $uri/ =404;
	}

	error_page 404 /404.html;
}
