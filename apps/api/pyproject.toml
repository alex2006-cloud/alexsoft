[project]
name = "alexsoft-api"
version = "0.1.0"
description = "BL API (FastAPI) for alexsoft: JWT via Authentik JWKS, agent registry, runs, quota, admin"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "asyncpg>=0.29",
  "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alexsoft_api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
